<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA All-Star Selections</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        @font-face {
            font-family: 'Inter Black Italic';
            src: url('/Users/maxenceduffuler/Downloads/Inter,Staatliches/Inter/static/Inter_28pt-BlackItalic.ttf') format('truetype');
            font-weight: 900;
            font-style: italic;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: black;
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(200, 16, 46, 0.3) 0%, transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(29, 66, 138, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.05) 0%, transparent 60%);
            pointer-events: none;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        #container {
            width: 100%;
            height: 100%;
            position: relative;
            margin: 0;
        }
        
        .star {
            cursor: pointer;
            transition: opacity 0.3s ease;
        }
        
        .star:hover {
            opacity: 0.8;
        }
        
        .tooltip {
            position: absolute;
            background: linear-gradient(135deg, #1d428a 0%, #c8102e 50%, #1d428a 100%);
            background-size: 200% 200%;
            color: #fff;
            padding: 10px;
            border-radius: 14px;
            font-size: 10px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7),
                        0 0 0 2px rgba(255, 215, 0, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.15),
                        inset 0 -1px 0 rgba(0, 0, 0, 0.2);
            z-index: 1000;
            min-width: 260px;
            overflow: hidden;
            transform: translateY(10px);
            border: 2px solid rgba(255, 215, 0, 0.6);
            display: flex;
            gap: 10px;
            align-items: center;
            backdrop-filter: blur(10px);
        }
        
        .tooltip.pinned {
            pointer-events: auto;
            border: 3px solid #FFD700;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.9),
                        0 0 0 3px rgba(255, 215, 0, 0.6),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2),
                        inset 0 -1px 0 rgba(0, 0, 0, 0.3);
        }
        
        @keyframes cardGradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .tooltip::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 70% 80%, rgba(255, 215, 0, 0.1) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }
        
        .tooltip.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .tooltip-left {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            position: relative;
            z-index: 1;
        }
        
        .tooltip-photo-container {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #FFD700;
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.5),
                        0 0 0 2px rgba(255, 255, 255, 0.2),
                        inset 0 2px 4px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, #1e3a5f 0%, #2d5a8c 100%);
        }
        
        .tooltip-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .tooltip-photo-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3a5f 0%, #2d5a8c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: white;
            font-family: 'Inter Black Italic', 'Arial Black', sans-serif;
        }
        
        .player-name {
            font-weight: 800;
            font-size: 13px;
            text-align: center;
            color: #FFD700;
            font-family: 'Inter Black Italic', 'Arial Black', sans-serif;
            letter-spacing: -0.2px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5),
                         0 0 10px rgba(255, 215, 0, 0.3);
        }
        
        .tooltip-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
            position: relative;
            z-index: 1;
        }
        
        .allstar-title {
            font-weight: 700;
            font-size: 12px;
            text-align: center;
            color: #ffffff;
            font-family: 'Inter Black Italic', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            letter-spacing: -0.1px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .stars-display {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            max-width: 180px;
            justify-content: center;
            padding: 3px 0;
        }
        
        .star-icon {
            font-size: 16px;
            width: 16px;
            text-align: center;
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.5));
        }
        
        .years-display {
            font-size: 8px;
            font-weight: 400;
            color: #FFD700;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            letter-spacing: 0.5px;
            margin-top: 1px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
            background: rgba(0, 0, 0, 0.2);
            padding: 3px 8px;
            border-radius: 8px;
        }

        @keyframes lebronPulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
        }

        @keyframes lebronGlow {
            0%, 100% {
                filter: drop-shadow(0 0 5px #FFD700) drop-shadow(0 0 10px #FFA500) drop-shadow(0 0 15px #FF8C00);
            }
            50% {
                filter: drop-shadow(0 0 10px #FFD700) drop-shadow(0 0 20px #FFA500) drop-shadow(0 0 30px #FF8C00) drop-shadow(0 0 40px #FF6347);
            }
        }

        .lebron-star {
            animation: lebronGlow 2s ease-in-out infinite;
        }

        .lebron-star path {
            animation: lebronPulse 2s ease-in-out infinite;
        }

        @keyframes particleFloat {
            0% {
                opacity: 0;
                transform: translate(0, 0) scale(0);
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(1);
            }
        }

        .particle {
            animation: particleFloat 3s ease-out infinite;
        }

        @keyframes star2026Glow {
            0%, 100% {
                filter: drop-shadow(0 0 3px #FFD700) drop-shadow(0 0 6px #FFA500);
            }
            50% {
                filter: drop-shadow(0 0 6px #FFD700) drop-shadow(0 0 12px #FFA500) drop-shadow(0 0 18px #FF8C00);
            }
        }

        @keyframes star2026Pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(2);
            }
        }

        .star-2026 {
            animation: star2026Glow 3s ease-in-out infinite;
        }

        .star-2026 path {
            animation: star2026Pulse 3s ease-in-out infinite;
        }

        .title {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 56px;
            font-weight: 900;
            color: #FFD700;
            letter-spacing: 8px;
            z-index: 100;
            font-family: 'Inter Black Italic', 'Georgia', 'Times New Roman', serif;
            font-style: italic;
            text-transform: uppercase;
            opacity: 1;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6),
                         0 0 40px rgba(255, 215, 0, 0.4),
                         0 4px 8px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div class="tooltip"></div>

    <script>
        // Mapping des photos des joueurs (URLs des photos NBA)
        const playerPhotos = {
            'LeBron James': 'https://cdn.nba.com/headshots/nba/latest/1040x760/2544.png',
            'Kareem Abdul-Jabbar': 'https://cdn.nba.com/headshots/nba/latest/1040x760/76003.png',
            'Kobe Bryant': 'https://cdn.nba.com/headshots/nba/latest/1040x760/977.png',
            'Tim Duncan': 'https://cdn.nba.com/headshots/nba/latest/1040x760/1495.png',
            'Shaquille O\'Neal': 'https://cdn.nba.com/headshots/nba/latest/1040x760/406.png',
            'Kevin Durant': 'https://cdn.nba.com/headshots/nba/latest/1040x760/201142.png',
            'Michael Jordan': 'https://cdn.nba.com/headshots/nba/latest/1040x760/893.png',
            'Karl Malone': 'https://cdn.nba.com/headshots/nba/latest/1040x760/252.png',
            'Dirk Nowitzki': 'https://cdn.nba.com/headshots/nba/latest/1040x760/1717.png',
            'Wilt Chamberlain': 'https://cdn.nba.com/headshots/nba/latest/1040x760/76375.png',
            'Kevin Garnett': 'https://cdn.nba.com/headshots/nba/latest/1040x760/708.png',
            'Jerry West': 'https://cdn.nba.com/headshots/nba/latest/1040x760/77160.png',
            'Bob Cousy': 'https://cdn.nba.com/headshots/nba/latest/1040x760/76393.png',
            'Stephen Curry': 'https://cdn.nba.com/headshots/nba/latest/1040x760/201939.png',
            'Julius Erving': 'https://cdn.nba.com/headshots/nba/latest/1040x760/76505.png',
            'Moses Malone': 'https://cdn.nba.com/headshots/nba/latest/1040x760/76484.png',
            'Hakeem Olajuwon': 'https://cdn.nba.com/headshots/nba/latest/1040x760/165.png',
            'Dwyane Wade': 'https://cdn.nba.com/headshots/nba/latest/1040x760/2548.png',
            'Bob Pettit': 'https://cdn.nba.com/headshots/nba/latest/1040x760/77274.png',
            'Elgin Baylor': 'https://cdn.nba.com/headshots/nba/latest/1040x760/76135.png',
            'Jerry West': 'https://cdn.nba.com/headshots/nba/latest/1040x760/78497.png',
            'John Havlicek': 'https://cdn.nba.com/headshots/nba/latest/1040x760/76970.png',
            'Larry Bird': 'https://cdn.nba.com/headshots/nba/latest/1040x760/1449.png',
            'Elvin Hayes': 'https://cdn.nba.com/headshots/nba/latest/1040x760/76979.png',
            'Magic Johnson': 'https://cdn.nba.com/headshots/nba/latest/1040x760/77142.png',
            'Chris Paul': 'https://cdn.nba.com/headshots/nba/latest/1040x760/101108.png',
            'Oscar Robertson': 'https://cdn.nba.com/headshots/nba/latest/1040x760/600015.png',
            'Bill Russell': 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQNqqCyGojzd0-oIQgF3iN0TNu8_RynpgW0Gw&s',
            'Dolph Schayes': 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/6e/Dolph_Schayes_1957_%281%29.jpeg/330px-Dolph_Schayes_1957_%281%29.jpeg',
            'Isiah Thomas': 'https://cdn.nba.com/headshots/nba/latest/1040x760/78318.png',
            'Charles Barkley': 'https://cdn.nba.com/headshots/nba/latest/1040x760/787.png',
            'Elgin Baylor': 'https://cdn.nba.com/headshots/nba/latest/1040x760/76127.png',
            'Chris Bosh': 'https://cdn.nba.com/headshots/nba/latest/1040x760/2547.png',
            'Julius Erving': 'https://cdn.nba.com/headshots/nba/latest/1040x760/76681.png',
            'Patrick Ewing': 'https://cdn.nba.com/headshots/nba/latest/1040x760/121.png',
            'James Harden': 'https://cdn.nba.com/headshots/nba/latest/1040x760/201935.png',
            'Allen Iverson': 'https://cdn.nba.com/headshots/nba/latest/1040x760/947.png',
            'Giannis Antetokounmpo': 'https://cdn.nba.com/headshots/nba/latest/1040x760/203507.png',
            'Nikola Jokić': 'https://cdn.nba.com/headshots/nba/latest/1040x760/203999.png',
            'Kawhi Leonard': 'https://cdn.nba.com/headshots/nba/latest/1040x760/202695.png',
            'Luka Dončić': 'https://cdn.nba.com/headshots/nba/latest/1040x760/1629029.png',
            'Karl-Anthony Towns': 'https://cdn.nba.com/headshots/nba/latest/1040x760/1626157.png',
            'Devin Booker': 'https://cdn.nba.com/headshots/nba/latest/1040x760/1626164.png',
            'Jaylen Brown': 'https://cdn.nba.com/headshots/nba/latest/1040x760/1627759.png',
            'Anthony Edwards': 'https://cdn.nba.com/headshots/nba/latest/1040x760/1630162.png',
            'Shai Gilgeous-Alexander': 'https://cdn.nba.com/headshots/nba/latest/1040x760/1628983.png',
            'Victor Wembanyama': 'https://cdn.nba.com/headshots/nba/latest/1040x760/1641705.png'
        };

        function getPlayerInitials(name) {
            return name.split(' ').map(n => n[0]).join('');
        }

        // Fonction pour vérifier si un joueur a été sélectionné en 2026
        function isSelected2026(yearsString) {
            return yearsString.includes('2026');
        }

        // Configuration dynamique basée sur la taille de l'écran
        const width = window.innerWidth;
        const height = window.innerHeight;

        // Création du SVG
        const svg = d3.select('#container')
            .append('svg')
            .attr('width', width)
            .attr('height', height);

        // Fonction pour créer un chemin d'étoile
        function starPath(size) {
            const points = 5;
            const outerRadius = size;
            const innerRadius = size * 0.4;
            let path = '';
            
            for (let i = 0; i < points * 2; i++) {
                const radius = i % 2 === 0 ? outerRadius : innerRadius;
                const angle = (Math.PI * i) / points - Math.PI / 2;
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;
                path += (i === 0 ? 'M' : 'L') + x + ',' + y;
            }
            path += 'Z';
            return path;
        }

        // Charger les données depuis le fichier CSV
        d3.csv('nba_allstar.csv').then(function(data) {
            
            // Parser les données
            const players = data.map(d => ({
                player: d.Player,
                selections: +d.Selections,
                years: d.Years,
                selected2026: isSelected2026(d.Years)
            }));

            // Échelle pour la taille des étoiles (échelle exponentielle pour accentuer les différences)
            const sizeScale = d3.scalePow()
                .exponent(2.5)
                .domain([0, d3.max(players, d => d.selections)])
                .range([2, 20]);

            // Échelle de couleur pour un effet dégradé doré
            const colorScale = d3.scaleLinear()
                .domain([0, d3.max(players, d => d.selections)])
                .range(['#FFD700', '#FFFFFF']);

            // Initialiser les positions aléatoirement sur tout l'écran
            players.forEach(d => {
                if (d.player === 'LeBron James') {
                    // LeBron est toujours au centre
                    d.x = width / 2;
                    d.y = height / 2;
                } else {
                    d.x = Math.random() * width;
                    d.y = Math.random() * height;
                }
            });

            // Simulation de force pour éviter les chevauchements tout en gardant la répartition rectangulaire
            const simulation = d3.forceSimulation(players)
                .force('charge', d3.forceManyBody().strength(5))
                .force('collision', d3.forceCollide().radius(d => sizeScale(d.selections) + 12))
                .force('x', d3.forceX(d => d.player === 'LeBron James' ? width / 2 : d.x).strength(d => d.player === 'LeBron James' ? 1 : 0.1))
                .force('y', d3.forceY(d => d.player === 'LeBron James' ? height / 2 : d.y).strength(d => d.player === 'LeBron James' ? 1 : 0.1))
                .force('bounds', () => {
                    players.forEach(d => {
                        const radius = sizeScale(d.selections) + 5;
                        if (d.player === 'LeBron James') {
                            // LeBron reste fixé au centre
                            d.x = width / 2;
                            d.y = height / 2;
                        } else {
                            d.x = Math.max(radius, Math.min(width - radius, d.x));
                            d.y = Math.max(radius, Math.min(height - radius, d.y));
                        }
                    });
                })
                .stop();

            // Exécuter la simulation pour disperser les étoiles
            for (let i = 0; i < 300; i++) simulation.tick();

            // Tooltip
            const tooltip = d3.select('.tooltip');
            let pinnedPlayer = null;

            // Fonction pour positionner le tooltip intelligemment
            function positionTooltip(event) {
                const tooltipNode = tooltip.node();
                const tooltipWidth = tooltipNode.offsetWidth;
                const tooltipHeight = tooltipNode.offsetHeight;
                const padding = 15;
                
                let left = event.pageX + padding;
                let top = event.pageY - 30;
                
                // Vérifier si le tooltip dépasse à droite
                if (left + tooltipWidth > window.innerWidth) {
                    left = event.pageX - tooltipWidth - padding;
                }
                
                // Vérifier si le tooltip dépasse en bas
                if (top + tooltipHeight > window.innerHeight) {
                    top = window.innerHeight - tooltipHeight - padding;
                }
                
                // Vérifier si le tooltip dépasse en haut
                if (top < padding) {
                    top = padding;
                }
                
                // Vérifier si le tooltip dépasse à gauche
                if (left < padding) {
                    left = padding;
                }
                
                tooltip
                    .style('left', left + 'px')
                    .style('top', top + 'px');
            }

            // Fonction pour afficher le tooltip
            function showTooltip(d, photoUrl) {
                const photoHtml = photoUrl 
                    ? `<img src="${photoUrl}" class="tooltip-photo" onerror="this.parentElement.innerHTML='<div class=\\'tooltip-photo-placeholder\\'>${getPlayerInitials(d.player)}</div>'">`
                    : `<div class="tooltip-photo-placeholder">${getPlayerInitials(d.player)}</div>`;
                
                // Générer les étoiles
                let starsHtml = '';
                for (let i = 0; i < d.selections; i++) {
                    starsHtml += '<span class="star-icon">⭐</span>';
                }
                
                // Extraire la première et dernière année
                const years = d.years.split(',').map(y => y.trim());
                
                tooltip
                    .html(`
                        <div class="tooltip-left">
                            <div class="tooltip-photo-container">
                                ${photoHtml}
                            </div>
                            <div class="player-name">${d.player}</div>
                        </div>
                        <div class="tooltip-right">
                            <div class="allstar-title">All-Star appearances (${d.selections})</div>
                            <div class="stars-display">
                                ${starsHtml}
                            </div>
                            <div class="years-display">${years}</div>
                        </div>
                    `)
                    .classed('visible', true);
            }

            // Clic sur le background pour dépingler
            svg.on('click', function(event) {
                if (event.target === this) {
                    pinnedPlayer = null;
                    tooltip
                        .classed('visible', false)
                        .classed('pinned', false);
                }
            });

            // Ajouter un glow effect standard
            const defs = svg.append('defs');
            
            const filter = defs.append('filter')
                .attr('id', 'glow');
            
            filter.append('feGaussianBlur')
                .attr('stdDeviation', '1.5')
                .attr('result', 'coloredBlur');
            
            const feMerge = filter.append('feMerge');
            feMerge.append('feMergeNode')
                .attr('in', 'coloredBlur');
            feMerge.append('feMergeNode')
                .attr('in', 'SourceGraphic');

            // Créer les étoiles avec la classe appropriée
            const stars = svg.selectAll('.star')
                .data(players)
                .enter()
                .append('g')
                .attr('class', d => {
                    if (d.player === 'LeBron James') return 'star lebron-star';
                    if (d.selected2026) return 'star star-2026';
                    return 'star';
                })
                .attr('transform', d => `translate(${d.x}, ${d.y})`)
                .on('mouseenter', function(event, d) {
                    // Ne pas afficher le tooltip au hover si un autre joueur est pinglé
                    if (pinnedPlayer && pinnedPlayer !== d.player) {
                        return;
                    }
                    
                    const photoUrl = playerPhotos[d.player];
                    showTooltip(d, photoUrl);
                    positionTooltip(event);
                })
                .on('mousemove', function(event, d) {
                    // Ne pas bouger le tooltip si un joueur est pinglé
                    if (pinnedPlayer) {
                        return;
                    }
                    positionTooltip(event);
                })
                .on('mouseleave', function(event, d) {
                    // Ne pas cacher le tooltip si ce joueur est pinglé
                    if (pinnedPlayer === d.player) {
                        return;
                    }
                    tooltip.classed('visible', false);
                })
                .on('click', function(event, d) {
                    event.stopPropagation();
                    
                    // Si on clique sur le joueur déjà pinglé, on le dépingle
                    if (pinnedPlayer === d.player) {
                        pinnedPlayer = null;
                        tooltip
                            .classed('visible', false)
                            .classed('pinned', false);
                    } else {
                        // Sinon on pingle ce joueur
                        pinnedPlayer = d.player;
                        const photoUrl = playerPhotos[d.player];
                        showTooltip(d, photoUrl);
                        positionTooltip(event);
                        tooltip.classed('pinned', true);
                    }
                });

            // Dessiner les étoiles
            stars.append('path')
                .attr('d', d => starPath(sizeScale(d.selections)))
                .attr('fill', d => d.player === 'LeBron James' ? '#FFD700' : colorScale(d.selections))
                .attr('stroke', d => d.player === 'LeBron James' ? '#FFA500' : '#FFFFFF')
                .attr('stroke-width', d => d.player === 'LeBron James' ? 2 : 0.5)
                .attr('filter', 'url(#glow)')
                .style('opacity', 0)
                .transition()
                .duration(600)
                .delay((d, i) => i * 20)
                .style('opacity', 1);

        }).catch(function(error) {
            console.error('Erreur lors du chargement du fichier CSV:', error);
            alert('Impossible de charger le fichier nba_allstar.csv. Vérifiez que le fichier est dans le même dossier que le HTML.');
        });
    </script>
</body>
</html>
